server {
    listen 80;
    server_name mobile.paliroweb.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paliro-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mobile.paliroweb.site;

    ssl_certificate /srv/paliro/shared/tls/fullchain.pem;
    ssl_certificate_key /srv/paliro/shared/tls/privkey.pem;
    # This host's current Nginx/OpenSSL build supports TLS 1.2.
    ssl_protocols TLSv1.2;

    access_log /srv/paliro/logs/nginx-access.log;
    error_log /srv/paliro/logs/nginx-error.log warn;
    client_max_body_size 32k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}
